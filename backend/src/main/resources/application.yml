spring:
  application:
    name: sinteticas-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sinteticas_db}
    username: ${SPRING_DATASOURCE_USERNAME:sinteticas}
    # Sin valor por defecto: la contraseña siempre viene del entorno (.env)
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Todas las fechas se guardan en UTC (columnas TIMESTAMPTZ)
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Zona horaria del negocio: los horarios de las canchas se interpretan en hora de Colombia
  zone-id: America/Bogota
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Clave HMAC para firmar los tokens: mínimo 32 caracteres, sin valor por defecto
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:8h}
      issuer: sinteticas-api
  bootstrap:
    # Si se definen, al arrancar se crea (o promueve) este usuario como SUPER_ADMIN
    super-admin:
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}
      full-name: ${SUPER_ADMIN_NAME:Super Administrador}
