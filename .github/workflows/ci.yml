# Verifica automáticamente cada Pull Request: hace cumplir la regla
# "no se hace merge de un PR sin que al menos compile" del README.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (compilar + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Los tests usan Testcontainers: los runners de GitHub ya traen Docker
      - name: Compilar y correr tests
        run: ./mvnw -B verify

      - name: Publicar reportes si fallan los tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (compilar)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  e2e:
    name: Pruebas de punta a punta (Playwright)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      # .env de prueba con claves aleatorias generadas en cada ejecución (nunca se guardan)
      - name: Crear .env de prueba
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n/+=')|" .env
          sed -i "s|^SUPER_ADMIN_PASSWORD=.*|SUPER_ADMIN_PASSWORD=$(openssl rand -hex 12)Aa1|" .env

      - name: Levantar el sistema con Docker Compose
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/health > /dev/null && curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 3
          done
          echo "El sistema no respondió a tiempo" && docker compose logs && exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Correr las pruebas
        working-directory: e2e
        run: |
          set -a; . ../.env; set +a
          npx playwright test

      - name: Logs de los contenedores si fallan
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Publicar reporte si fallan
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt

  produccion:
    name: Producción (build + verificación)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      # Igual que en un servidor, pero por HTTP (:80) y sin correo real. Claves aleatorias en cada ejecución.
      - name: Crear .env.prod de prueba
        run: |
          {
            echo "SITE_ADDRESS=:80"
            echo "PUBLIC_URL=http://localhost"
            echo "ACME_EMAIL=ci@example.com"
            echo "POSTGRES_DB=sinteticas_db"
            echo "POSTGRES_USER=sinteticas"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "SUPER_ADMIN_EMAIL=admin@ci.local"
            echo "SUPER_ADMIN_PASSWORD=$(openssl rand -hex 12)Aa1"
            echo "MAIL_ENABLED=false"
            echo "MAIL_HOST=localhost"
            echo "MAIL_FROM=no-reply@ci.local"
          } > .env.prod

      - name: Levantar con docker-compose.prod.yml
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost/api/v1/health > /dev/null && exit 0
            sleep 3
          done
          echo "Producción no respondió a tiempo" && docker compose -f docker-compose.prod.yml --env-file .env.prod logs && exit 1

      - name: Verificación de producción (deploy/smoke-test.sh)
        run: ./deploy/smoke-test.sh http://localhost

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Las mismas pruebas de navegador, contra el build de producción (sin la de correo: aquí no hay Mailpit)
      - name: Pruebas e2e contra producción
        working-directory: e2e
        env:
          FRONTEND_URL: http://localhost
          API_URL: http://localhost
        run: |
          npm ci
          npx playwright install --with-deps chromium
          export $(grep -E '^SUPER_ADMIN_(EMAIL|PASSWORD)=' ../.env.prod | xargs)
          npx playwright test --grep-invert "olvidar la contraseña"

      - name: Logs si falla
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs --no-color > prod-logs.txt

      - name: Publicar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: produccion-reporte
          path: |
            e2e/playwright-report
            e2e/test-results
            prod-logs.txt
